{{ registrationForm.value | json }}
<div class="container-fluid">
  <h2>Registration Form</h2>
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        [class.is-invalid]="userName?.invalid && userName?.touched"
        formControlName="userName"
        type="text"
        class="form-control"
      />
      <div *ngIf="userName?.invalid && userName?.touched">
        <small *ngIf="userName?.errors?.['required']" class="text-danger"
          >Username is required</small
        >
        <small *ngIf="userName?.errors?.['minlength']" class="text-danger"
          >Username must be at least 3 characters</small
        >
        <small *ngIf="userName?.errors?.['forbiddenName']" class="text-danger"
          >{{ userName?.errors?.['forbiddenName'].value }} Username not allowed</small
        >
      </div>
    </div>

    <div class="form-group">
      <label for="">Email</label>
      <button type="button" class="btn btn-secondary btn-sm m-2" (click)="addalternateEmails()">
        Add e-mail
      </button>
      <input
        [class.is-invalid]="email?.invalid && email?.touched"
        type="text"
        name="email"
        id="email"
        formControlName="email"
        class="form-control"
      />
      <small class="text-danger" [class.d-none]="email?.valid || email?.untouched"
        >Email is required</small
      >
      <div
        formArrayName="alternateEmails"
        *ngFor="let email of alternateEmails.controls; let i = index"
      >
        <input type="text" class="form-control my-1" formControlName="i" />
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" formControlName="subscribe" />
        <label for="form-check-label" class="form-check-label">Send me promotional offers</label>
      </div>
    </div>

    <div class="form-group">
      <label for="Password">Password</label>
      <input
        [class.is-invalid]="
          registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched
        "
        formControlName="password"
        type="password"
        class="form-control"
      />
      <div
        *ngIf="
          registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched
        "
      >
        <small *ngIf="registrationForm.get('password')?.errors?.['required']" class="text-danger"
          >Password is required</small
        >
        <small *ngIf="registrationForm.get('password')?.errors?.['minlength']" class="text-danger"
          >Password must be at least 10 characters</small
        >
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input
        [class.is-invalid]="registrationForm.errors?.['misMatch']"
        formControlName="confirmPassword"
        type="password"
        class="form-control"
      />
      <small class="text-danger" *ngIf="registrationForm.errors?.['misMatch']"
        >Password do not match</small
      >
      <!-- <div
        *ngIf="
          registrationForm.get('confirmPassword')?.invalid &&
          registrationForm.get('confirmPassword')?.touched
        "
      >
        <small
          *ngIf="registrationForm.get('confirmPassword')?.errors?.['required']"
          class="text-danger"
          >Confirm Password is required</small
        >
        <small
          *ngIf="registrationForm.get('confirmPassword')?.errors?.['minlength']"
          class="text-danger"
          >Confirm Password must be at least 10 characters</small
        >
      </div> -->
    </div>
    <div formGroupName="address" class="mt-3">
      <div class="form-group">
        <label>City</label>
        <input
          [class.is-invalid]="
            registrationForm.get('city')?.invalid && registrationForm.get('city')?.touched
          "
          formControlName="city"
          type="text"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label>State</label>
        <input formControlName="state" type="text" class="form-control" />
      </div>
      <div class="form-group">
        <label>Postal Code</label>
        <input formControlName="postalCode" type="text" class="form-control" />
      </div>
    </div>
    <button type="submit" [disabled]="!registrationForm.valid" class="btn btn-primary mt-3 ml-20">
      Register
    </button>
    <button (click)="loadApiData()" class="btn btn-secondary mt-3" type="button">
      Load API Data
    </button>
  </form>
</div>
